name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend - build e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tavernaonline_test
          POSTGRES_USER: taverna
          POSTGRES_PASSWORD: taverna
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: tavernaonline_test
      DB_NAME_TEST: tavernaonline_test
      DB_USER: taverna
      DB_PASSWORD: taverna

    steps:
      - uses: actions/checkout@v4

      - name: Configura JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build e testes
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: Frontend - build e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configura Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instala dependencias
        working-directory: frontend
        run: npm install

      - name: Testes
        working-directory: frontend
        run: npm run test:ci

      - name: Build de producao
        working-directory: frontend
        run: npm run build
