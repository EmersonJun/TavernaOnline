<mat-card style="margin-bottom: 16px">
  <mat-card-header><mat-card-title>Nova anotacao</mat-card-title></mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="salvar()">
      <mat-form-field class="full-width">
        <mat-label>Titulo</mat-label>
        <input matInput formControlName="titulo" />
      </mat-form-field>
      <mat-form-field class="full-width">
        <mat-label>Conteudo</mat-label>
        <textarea matInput formControlName="conteudo" rows="4"></textarea>
      </mat-form-field>
      <mat-form-field class="full-width">
        <mat-label>Visibilidade</mat-label>
        <mat-select formControlName="visibilidade">
          @for (opcao of visibilidades; track opcao) {
            <mat-option [value]="opcao">{{ opcao }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <button mat-flat-button color="primary" [disabled]="form.invalid">Salvar anotacao</button>
    </form>
  </mat-card-content>
</mat-card>

@for (anotacao of anotacoes(); track anotacao.id) {
  <mat-card style="margin-bottom: 12px">
    <mat-card-header>
      <mat-card-title>{{ anotacao.titulo }}</mat-card-title>
      <mat-card-subtitle>
        {{ anotacao.autorNome }}
        <mat-chip-set><mat-chip>{{ anotacao.visibilidade }}</mat-chip></mat-chip-set>
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p style="white-space: pre-wrap">{{ anotacao.conteudo }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button (click)="excluir(anotacao)">
        <mat-icon>delete</mat-icon> Remover
      </button>
    </mat-card-actions>
  </mat-card>
}
