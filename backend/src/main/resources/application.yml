spring:
  application:
    name: tavernaonline
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tavernaonline}
    username: ${DB_USER:taverna}
    password: ${DB_PASSWORD:taverna}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: ${JWT_SECRET:troque-por-uma-chave-longa-e-aleatoria-com-no-minimo-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
